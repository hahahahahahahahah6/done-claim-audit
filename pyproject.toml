[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "done-claim-audit"
version = "0.1.0"
description = "Offline heuristic audit of completion claims against transcripts and git"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
done-claim-audit = "done_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
